[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent"]
# crates/relay (Cloudflare Worker via workers-rs) is added in M2 once the wasm32 toolchain is set up.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bilalbayram/frigate-for-ios"

[workspace.dependencies]
iwa-protocol = { path = "crates/protocol" }
